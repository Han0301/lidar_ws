# 同一分辨率与几何；10 Hz 更新，20 Hz 发布上限
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 20.0
      global_frame: odom
      robot_base_frame: nav_base
      rolling_window: true
      width: 12
      height: 12
      resolution: 0.1
      robot_radius: 0.25
      transform_tolerance: 0.3
      initial_transform_timeout: 30.0
      track_unknown_space: true
      always_send_full_costmap: true
      plugins:
      - ray_layer
      - ground_consistency
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 3.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      ray_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: false
        origin_z: -2.0
        z_resolution: 0.35
        z_voxels: 16
        max_obstacle_height: 3.5
        mark_threshold: 0
        unknown_threshold: 15
        observation_sources: clear
        clear:
          data_type: PointCloud2
          sensor_frame: nav_sensor
          observation_persistence: 0.0
          expected_update_rate: 0.5
          max_obstacle_height: 3.5
          min_obstacle_height: -2.0
          obstacle_min_range: 0.45
          obstacle_max_range: 12.0
          raytrace_min_range: 0.0
          raytrace_max_range: 15.0
          topic: /perception/clearing
          marking: false
          clearing: true
      ground_consistency:
        plugin: nav2_ground_consistency_costmap_plugin::GroundConsistencyLayer
        ground_points_topic: /perception/ground
        nonground_points_topic: /perception/obstacles
        tf_timeout: 0.1
        min_clearance: 0.12
        robot_height: 2.5
        maximum_height_filter: 4.0
        ground_inc: 1.0
        nonground_inc: 1.5
        ground_decay: 0.8
        nonground_decay: 0.85
        max_score: 20.0
        nonground_occ_thresh: 6.0
        nonground_prob_thresh: 0.75
        ground_free_thresh: 2.0
        discretize_costs: true
        max_data_range: 15.0
        ground_neighbor_search_cells: 1
        enable_kpi_logging: false
