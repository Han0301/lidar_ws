# Clear along measured rays from the sensor origin; never invent endpoints.
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: nav_base
      rolling_window: true
      width: 12
      height: 12
      resolution: 0.1
      robot_radius: 0.25
      transform_tolerance: 0.3
      initial_transform_timeout: 120.0
      track_unknown_space: true
      always_send_full_costmap: true
      plugins:
      - voxel_layer
      - inflation_layer
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: true
        origin_z: -2.0
        z_resolution: 0.35
        z_voxels: 16
        max_obstacle_height: 3.5
        mark_threshold: 0
        unknown_threshold: 15
        observation_sources: scan
        mark:
          data_type: PointCloud2
          sensor_frame: nav_sensor
          observation_persistence: 0.0
          expected_update_rate: 0.5
          max_obstacle_height: 3.5
          min_obstacle_height: -2.0
          obstacle_min_range: 0.45
          obstacle_max_range: 12.0
          raytrace_min_range: 0.0
          raytrace_max_range: 15.0
          topic: /perception/obstacles
          marking: true
          clearing: false
        clear:
          data_type: PointCloud2
          sensor_frame: nav_sensor
          observation_persistence: 0.0
          expected_update_rate: 0.5
          max_obstacle_height: 3.5
          min_obstacle_height: -2.0
          obstacle_min_range: 0.45
          obstacle_max_range: 12.0
          raytrace_min_range: 0.0
          raytrace_max_range: 15.0
          topic: /perception/clearing
          marking: false
          clearing: true
        scan:
          data_type: LaserScan
          topic: /scan
          sensor_frame: nav_sensor
          marking: true
          clearing: true
          max_obstacle_height: 3.5
          obstacle_max_range: 12.0
          raytrace_max_range: 15.0
          observation_persistence: 0.0
          expected_update_rate: 0.5
          inf_is_valid: true
          min_obstacle_height: -2.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 3.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: nav_base
      rolling_window: false
      width: 12
      height: 12
      resolution: 0.1
      robot_radius: 0.25
      transform_tolerance: 0.3
      initial_transform_timeout: 120.0
      track_unknown_space: true
      always_send_full_costmap: true
      plugins:
      - static_layer
      - voxel_layer
      - inflation_layer
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: true
        origin_z: -2.0
        z_resolution: 0.35
        z_voxels: 16
        max_obstacle_height: 3.5
        mark_threshold: 0
        unknown_threshold: 15
        observation_sources: scan
        mark:
          data_type: PointCloud2
          sensor_frame: nav_sensor
          observation_persistence: 0.0
          expected_update_rate: 0.5
          max_obstacle_height: 3.5
          min_obstacle_height: -2.0
          obstacle_min_range: 0.45
          obstacle_max_range: 12.0
          raytrace_min_range: 0.0
          raytrace_max_range: 15.0
          topic: /perception/obstacles
          marking: true
          clearing: false
        clear:
          data_type: PointCloud2
          sensor_frame: nav_sensor
          observation_persistence: 0.0
          expected_update_rate: 0.5
          max_obstacle_height: 3.5
          min_obstacle_height: -2.0
          obstacle_min_range: 0.45
          obstacle_max_range: 12.0
          raytrace_min_range: 0.0
          raytrace_max_range: 15.0
          topic: /perception/clearing
          marking: false
          clearing: true
        scan:
          data_type: LaserScan
          topic: /scan
          sensor_frame: nav_sensor
          marking: true
          clearing: true
          max_obstacle_height: 3.5
          obstacle_max_range: 12.0
          raytrace_max_range: 15.0
          observation_persistence: 0.0
          expected_update_rate: 0.5
          inf_is_valid: true
          min_obstacle_height: -2.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55
        cost_scaling_factor: 3.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.2
      use_astar: true
      allow_unknown: false
controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    odom_topic: /odom
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.2
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.4
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.4
      min_speed_theta: 0.0
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 2.0
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -2.0
      vx_samples: 15
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.05
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.03
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
      - RotateToGoal
      - Oscillation
      - BaseObstacle
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      BaseObstacle.scale: 0.04
      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 16.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 24.0
      GoalDist.scale: 16.0
      RotateToGoal.scale: 24.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: nav_base
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators:
    - navigate_to_pose
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - wait
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: nav_base
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.0
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ''
loopback_simulator:
  ros__parameters:
    base_frame_id: nav_base
    odom_frame_id: odom
    map_frame_id: map
    scan_frame_id: nav_sensor
    update_duration: 0.02
    scan_publish_duration: 0.1
    scan_range_min: 0.05
    scan_range_max: 15.0
    scan_angle_increment: 0.01745
    scan_use_inf: true
    publish_clock: true
    enable_stamped_cmd_vel: false
